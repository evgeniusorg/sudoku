<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#222222"/>
  <!-- 9x9 Sudoku board -->
  <rect x="40" y="40" width="432" height="432" rx="10" fill="#2b2b31" stroke="#f2f3f5" stroke-width="8"/>

  <!-- thin grid lines -->
  <g stroke="#3a3a40" stroke-width="2">
    <line x1="88" y1="40" x2="88" y2="472"/>
    <line x1="136" y1="40" x2="136" y2="472"/>
    <line x1="232" y1="40" x2="232" y2="472"/>
    <line x1="280" y1="40" x2="280" y2="472"/>
    <line x1="376" y1="40" x2="376" y2="472"/>
    <line x1="424" y1="40" x2="424" y2="472"/>
    <line x1="40" y1="88" x2="472" y2="88"/>
    <line x1="40" y1="136" x2="472" y2="136"/>
    <line x1="40" y1="232" x2="472" y2="232"/>
    <line x1="40" y1="280" x2="472" y2="280"/>
    <line x1="40" y1="376" x2="472" y2="376"/>
    <line x1="40" y1="424" x2="472" y2="424"/>
  </g>

  <!-- bold 3x3 box lines -->
  <g stroke="#f2f3f5" stroke-width="6">
    <line x1="184" y1="40" x2="184" y2="472"/>
    <line x1="328" y1="40" x2="328" y2="472"/>
    <line x1="40" y1="184" x2="472" y2="184"/>
    <line x1="40" y1="328" x2="472" y2="328"/>
  </g>

  <!-- given digits -->
  <g font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f2f3f5" text-anchor="middle">
    <text x="64" y="76">5</text>
    <text x="256" y="76">3</text>
    <text x="448" y="76">7</text>
    <text x="160" y="124">1</text>
    <text x="304" y="124">9</text>
    <text x="400" y="124">8</text>
    <text x="208" y="172">6</text>
    <text x="448" y="172">4</text>
    <text x="64" y="220">8</text>
    <text x="256" y="220">1</text>
    <text x="400" y="220">5</text>
    <text x="112" y="268">9</text>
    <text x="352" y="268">2</text>
    <text x="160" y="316">7</text>
    <text x="304" y="316">4</text>
    <text x="64" y="364">3</text>
    <text x="352" y="364">6</text>
    <text x="112" y="412">6</text>
    <text x="256" y="412">5</text>
    <text x="448" y="412">9</text>
    <text x="160" y="460">4</text>
    <text x="400" y="460">2</text>
  </g>
</svg>
